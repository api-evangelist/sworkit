aid: sworkit
name: Sworkit
description: >-
  Sworkit Health is a digital wellbeing platform combining on-demand fitness,
  mindfulness, mobility and recovery, nutrition, and wellness challenges to help
  organizations improve employee engagement and workforce health. Rather than a
  public REST API, Sworkit exposes its workout content to developers through the
  Sworkit Workout Player Platform — an embeddable web player and a React Native
  mobile SDK component, both published on npm under the @sworkit org. Its security
  and compliance posture covers SOC 2 Type 2, HIPAA, and GDPR.
